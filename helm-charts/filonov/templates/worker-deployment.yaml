{{- if .Values.filonov.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filonov.workerName" . }}
  labels:
    {{- include "filonov.workerLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "filonov.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "filonov.workerLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "filonov.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: deps-volume
          emptyDir: {}
      initContainers:
        {{- if or  .Values.filonov.taggingDb.enabled .Values.filonov.similarityDb.enabled }}
        - name: install-postres-driver
          image: ghcr.io/astral-sh/uv:0.10-python3.13-trixie
          command: ["uv", "pip", "install"]
          args:
            - "--target"
            - "/shared-deps"
            - "psycopg2-binary"
          volumeMounts:
            - name: deps-volume
              mountPath: /shared-deps
        {{- end }}
        {{- with .Values.initContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - "celery"
            - "-A"
            - "filonov.entrypoints.tasks"
            - "--broker=$(CELERY_BROKER_URL)"
            - "worker"
            - "--loglevel=info"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if or  .Values.filonov.taggingDb.enabled .Values.filonov.similarityDb.enabled }}
              - name: deps-volume
                mountPath: /shared-deps
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.filonov.worker.enabled }}
            - name: CELERY_BROKER_URL
              value: {{ include "filonov.redisUrl" . | quote }}
            {{- end }}
            {{- if .Values.filonov.taggingDb.enabled }}
            - name: MEDIA_TAGGING_DB_URL
              value: {{ include "filonov.mediaTaggingDb" . | quote }}
            {{- end }}
            {{- if .Values.filonov.similarityDb.enabled }}
            - name: SIMILARITY_DB_URL
              value: {{ include "filonov.mediaSimilarityDb" . | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- include "filonov.renderEnv" . | nindent 12 }}
            {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
