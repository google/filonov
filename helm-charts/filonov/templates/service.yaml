apiVersion: v1
kind: Service
metadata:
  name: {{ include "filonov.fullname" . }}
  labels:
    {{- include "filonov.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.filonov.server.type }}
      protocol: TCP
      name: {{ .Values.filonov.server.type }}
  selector:
    {{- include "filonov.selectorLabels" . | nindent 4 }}
