apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "media-tagging.fullname" . }}
  labels:
    {{- include "media-tagging.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.mediaTagging.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "media-tagging.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "media-tagging.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "media-tagging.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: deps-volume
          emptyDir: {}
      initContainers:
        {{- if .Values.mediaTagging.taggingDb.enabled }}
        - name: install-postres-driver
          image: ghcr.io/astral-sh/uv:0.10-python3.13-trixie
          command: ["uv", "pip", "install"]
          args:
            - "--target"
            - "/shared-deps"
            - "psycopg2-binary"
          volumeMounts:
            - name: deps-volume
              mountPath: /shared-deps
        {{- end }}
        {{- with .Values.initContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{ if eq .Values.mediaTagging.server.type "http" }}
          command:
            {{- if .Values.mediaTagging.otel.enabled }}
            - "opentelemetry-instrument"
            {{- end }}
            - "uvicorn"
            - "media_tagging.entrypoints.server:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "{{ .Values.service.port | int }}"
          {{ else if eq .Values.mediaTagging.server.type "grpc" }}
          command:
            {{- if .Values.mediaTagging.otel.enabled }}
            - "opentelemetry-instrument"
            {{- end }}
            - "python"
            - "-m"
            - "media_tagging.entrypoints.grpc_server"
            - "--port"
            - "{{ .Values.service.port | int }}"
          {{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.mediaTagging.server.type }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.mediaTagging.taggingDb.enabled }}
              - name: deps-volume
                mountPath: /shared-deps
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.mediaTagging.worker.enabled }}
            - name: CELERY_BROKER_URL
              value: {{ include "media-tagging.redisUrl" . | quote }}
            {{- end }}
            {{- if .Values.mediaTagging.taggingDb.enabled }}
            - name: MEDIA_TAGGING_DB_URL
              value: {{ include "media-tagging.mediaTaggingDb" . | quote }}
            {{- end }}
            {{- if .Values.mediaTagging.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.mediaTagging.otel.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.mediaTagging.otel.otelExporterOtlpEndpoint | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- include "media-tagging.renderEnv" . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
