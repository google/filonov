apiVersion: v1
kind: Service
metadata:
  name: {{ include "media-tagging.fullname" . }}
  labels:
    {{- include "media-tagging.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.mediaTagging.server.type }}
      protocol: TCP
      name: {{ .Values.mediaTagging.server.type }}
  selector:
    {{- include "media-tagging.selectorLabels" . | nindent 4 }}
